<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Arpeggi — Strumenti per la pratica: arpeggi casuali, diteggiature in posizione, rivolti ed esercizi con audio e tablatura. Di Fabrizio's Guitar Space.">
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <title>Arpeggi · Strumenti per la pratica</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e5484d'/%3E%3Cg stroke='%23fff' stroke-width='2'%3E%3Cpath d='M6 10h20M6 16h20M6 22h20'/%3E%3C/g%3E%3Ccircle cx='12' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-compact" id="open-settings" type="button" aria-controls="settings" aria-expanded="false" aria-label="Impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
    <div class="brand">
      <h1>Arpeggi</h1>
      <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        <span>Strumenti per la pratica</span>
      </a>
    </div>
    <button class="icon-btn only-compact-history" id="open-history" type="button" aria-controls="history" aria-expanded="false" aria-label="Cronologia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
    </button>
  </header>

  <div class="backdrop" id="backdrop" hidden></div>

  <div class="layout">
    <!-- Impostazioni: drawer su mobile, colonna fissa su desktop -->
    <aside class="panel panel-left" id="settings" aria-label="Impostazioni">
      <div class="panel-head">
        <h2>Impostazioni</h2>
        <button class="icon-btn close-panel" type="button" data-close aria-label="Chiudi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <section class="group">
        <h3>Arpeggi inclusi</h3>
        <div id="families" class="checklist"></div>
        <div class="row-buttons">
          <button type="button" class="chip-btn" id="all-families">Tutte</button>
          <button type="button" class="chip-btn" id="no-families">Nessuna</button>
        </div>
      </section>

      <section class="group">
        <h3><label for="root-select">Fondamentale</label></h3>
        <select id="root-select"></select>
      </section>

      <section class="group">
        <h3>Opzioni</h3>
        <label class="check">
          <input type="checkbox" id="avoid-repeats">
          <span>Evita ripetizioni consecutive</span>
        </label>
        <label class="check">
          <input type="checkbox" id="quiz-mode">
          <span>Esercizio: nascondi le note<small>Mostra solo la sigla: ricostruisci l'arpeggio, poi rivela la soluzione.</small></span>
        </label>
      </section>

      <p class="pool" id="pool-count"></p>
    </aside>

    <main class="main" id="main">
      <div class="draw-bar">
        <button type="button" class="draw-btn" id="draw" aria-label="Arpeggio casuale">
          <svg class="draw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8C14.3 16 15.5 17 17.5 17H21M3 17h3.5c1.4 0 2.4-.5 3.2-1.3M14.3 8.3c.8-.8 1.8-1.3 3.2-1.3H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
          <span class="draw-label">Arpeggio casuale</span>
        </button>
        <div class="transport-slot" id="transport-slot"></div>
        <p class="hint">Invio: nuovo arpeggio · Spazio: play/stop (con gli esercizi aperti) · ← →: tempo</p>
      </div>
      <p class="warning" id="empty-pool" hidden>Seleziona almeno una famiglia di arpeggi.</p>

      <div id="result" aria-live="polite"></div>
    </main>

    <aside class="panel panel-right" id="history" aria-label="Cronologia">
      <div class="panel-head">
        <h2>Cronologia</h2>
        <button class="icon-btn close-panel" type="button" data-close aria-label="Chiudi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ol class="history-list" id="history-list"></ol>
      <p class="muted" id="history-empty">Nessuna estrazione precedente.</p>
    </aside>
  </div>

  <template id="tpl-empty">
    <div class="empty-state">
      <svg viewBox="0 0 120 64" aria-hidden="true">
        <g class="es-strings"><path d="M4 8h112M4 18h112M4 28h112M4 38h112M4 48h112M4 58h112"/></g>
        <g class="es-frets"><path d="M30 8v50M60 8v50M90 8v50"/></g>
        <circle cx="45" cy="28" r="6" class="es-root"/><circle cx="75" cy="38" r="6"/><circle cx="105" cy="18" r="6"/>
      </svg>
      <p>Premi <strong>Arpeggio casuale</strong> per estrarre un arpeggio tra 19 qualità × 12 fondamentali, poi ascoltalo ed esercitati.</p>
    </div>
  </template>

  <script src="js/theory.js"></script>
  <script src="js/guitar.js"></script>
  <script src="js/chords.js"></script>
  <script src="js/events.js"></script>
  <script src="js/exercises/pool.js"></script>
  <script src="js/exercises/melodic.js"></script>
  <script src="js/exercises/rhythm.js"></script>
  <script src="js/exercises/fingering.js"></script>
  <script src="js/exercises/presets.js"></script>
  <script src="js/tab/layout.js"></script>
  <script src="js/tab/render.js"></script>
  <script src="js/audio/ks.js"></script>
  <script src="js/audio/engine.js"></script>
  <script src="js/audio/scheduler.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/link.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/app.js"></script>
  <script src="js/arpeggi.js"></script>
</body>
</html>
